name: Deploy Azure Functions

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

env:
  AZURE_FUNCTIONAPP_NAME: "prompt-governance-functions"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "backend"
  PYTHON_VERSION: "3.11"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for Azurite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start Azurite
        run: |
          npx --yes azurite --silent --skipApiVersionCheck --blobHost 127.0.0.1 --queueHost 127.0.0.1 --tableHost 127.0.0.1 --location /tmp/azurite-data &
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10000/devstoreaccount1 || echo "000")
            if [ "$code" != "000" ]; then echo "Azurite up ($code)"; exit 0; fi
            sleep 1
          done
          echo "Azurite did not come up in time" >&2
          exit 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-integration tests before deploying
        env:
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -m pytest tests/ --ignore=tests/integration --ignore=tests/load -q

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
